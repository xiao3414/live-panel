# OEM 2.0 八大 L1 设备实况直读（自动生成，勿手改；源: tools/generate_l1_live_reads.py）
module: OEM20 Live Reads
probes:
- id: sys.display.brightness_mode
  l1: System Configuration
  module: System Configuration / Display
  item: Auto Brightness
  display:
    type: toggle
  probe:
    kind: adb.settings
    namespace: system
    key: screen_brightness_mode
  labels:
    '1': 自动
    '0': 关
  write: false
  risk: safe
  refreshMs: 8000
