- id: ethernet.enable
  module: Network Configuration / Ethernet
  item: Ethernet
  display:
    type: text
  probe:
    kind: adb.shell
    cmd: ip link show eth0 2>/dev/null || ip link show | grep -E 'eth|usb' | head -3
  write: false
  risk: safe
  verifyPath: 设置 → 扩展坞 / 以太网
  refreshMs: 10000
  l1: Network Configuration
- id: bt.state
  module: Network Configuration / Bluetooth
  item: Bluetooth
  display:
    type: toggle
  labels:
    '1': 开
    '0': 关
  probe:
    kind: adb.shell
    cmd: settings get global bluetooth_on
  write:
    kind: adb.settings
    namespace: global
    key: bluetooth_on
    values:
      on: '1'
      off: '0'
  readAfterWrite:
    kind: adb.settings
    namespace: global
    key: bluetooth_on
  sotiKey: BTEnable
  risk: safe
  verifyPath: 设置 → 已连接的设备 → 连接偏好设置 → 蓝牙
  refreshMs: 3000
  l1: Network Configuration
- id: nfc.state
  module: Network Configuration / NFC
  item: NFC Adapter
  display:
    type: toggle
  labels:
    '1': 开
    '0': 关
  probe:
    kind: adb.shell
    cmd: dumpsys nfc | grep -E 'mState|state=|Nfc enabled' | head -1
    parse: contains
    map:
      STATE_ON: '1'
      'mState=ON': '1'
      'state=ON': '1'
      'Nfc enabled: true': '1'
      STATE_OFF: '0'
      'mState=OFF': '0'
      'state=OFF': '0'
      'Nfc enabled: false': '0'
  write:
    kind: adb.shell
    onCmd: svc nfc enable
    offCmd: svc nfc disable
  readAfterWrite:
    kind: adb.shell
    cmd: dumpsys nfc | grep -E 'mState|state=|Nfc enabled' | head -1
    parse: contains
    map:
      STATE_ON: '1'
      'mState=ON': '1'
      'state=ON': '1'
      'Nfc enabled: true': '1'
      STATE_OFF: '0'
      'mState=OFF': '0'
      'state=OFF': '0'
      'Nfc enabled: false': '0'
  sotiKey: NFCEnable
  risk: safe
  verifyPath: 设置 → 已连接的设备 → 连接偏好设置 → NFC
  refreshMs: 5000
  l1: Network Configuration
