# OEM 2.0 L1: Network Configuration
module: Network Configuration
frameworkRef: 03_接口与配置映射/OEMConfig_2.0_产品框架/Network Configuration.md
probes:
- id: meta.layout_section.wlan
  module: Network Configuration / WLAN
  item: WLAN
  display:
    type: layout_section
  probe:
    kind: static
    sectionL1: Network Configuration
    sectionTitle: WLAN
    sectionHint: WiFi State · General · Advanced · Preference · Whitelist
  risk: safe
  enabled: true
  l1: Network Configuration
- id: meta.layout_section.network_other
  module: Network Configuration
  item: 其他网络项
  display:
    type: layout_section
  probe:
    kind: static
    sectionL1: Network Configuration
    sectionTitle: Private DNS · Ethernet
  risk: safe
  enabled: true
  l1: Network Configuration
- id: wifi.state
  module: Network Configuration / WiFi
  item: WiFi State
  display:
    type: toggle
  labels:
    '1': 启用
    '0': 禁用
  probe:
    kind: adb.shell
    cmd: cmd wifi status
    parse: contains
    map:
      Wifi is disabled: '0'
      Wi-Fi is disabled: '0'
      Wifi is enabled: '1'
      Wi-Fi is enabled: '1'
  write:
    kind: adb.shell
    onCmd: cmd wifi set-wifi-enabled enabled
    offCmd: cmd wifi set-wifi-enabled disabled
  readAfterWrite:
    kind: adb.shell
    cmd: cmd wifi status
    parse: contains
    map:
      Wifi is disabled: '0'
      Wi-Fi is disabled: '0'
      Wifi is enabled: '1'
      Wi-Fi is enabled: '1'
  sotiKey: wifiState
  risk: safe
  verifyPath: 设置 → 网络和互联网 → 互联网 → 使用 Wi‑Fi
  refreshMs: 3000
  l1: Network Configuration
- id: wifi.ssid
  module: Network Configuration / WiFi / WiFi Networks （WiFi网络）
  item: SSID
  display:
    type: text
  probe:
    kind: adb.shell
    cmd: dumpsys wifi | grep -m1 'SSID:'
    parse: regex
    pattern: 'SSID: "?([^"]+)"?'
  sotiKey: wlanSSID
  risk: safe
  verifyPath: 设置 → Wi‑Fi → 当前连接网络名称
  refreshMs: 5000
  l1: Network Configuration
- id: wifi.advanced_settings
  module: Network Configuration / WiFi / WiFi Advanced Option （WiFi高级选项）
  item: WiFi Advanced Settings
  display:
    type: wifi_advanced_settings_form
  probe:
    kind: static
    note: "IPC wifi:readAdvanced / wifi:applyAdvanced；USDK getIni/putIni 经 device-usdk-bridge"
  sotiKey: wlanAdvancedAction
  risk: warn
  verifyPath: WiFi 诊断专家模式 / OEM WiFi Advanced Option；SOTI Action=Configure
  enabled: true
  l1: Network Configuration
- id: wifi.general_settings
  module: Network Configuration / WiFi / WiFi Networks （WiFi网络）
